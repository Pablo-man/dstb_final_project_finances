version: '3.8'

services:
  createuser:
    image: pamendeza/createuser:latest
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always
    depends_on:
      - db

  readuser:
    image: pamendeza/readuser:latest
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always
    depends_on:
      - db

  updateuser:
    image: pamendeza/updateuser:latest
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always  
    depends_on:
      - db

  deleteuser:
    image: pamendeza/deleteuser:latest
    ports:
      - "3004:3004"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always
    depends_on:
      - db

  db:
      image: mongo:latest
      hostname: db
      ports:
        - "27017:27017"
      volumes:
        - /home/ubuntu/data/db:/data/db

