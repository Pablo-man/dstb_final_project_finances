name: User Domain Workflow deploy

on: 
  workflow_call:
    secrets:
      docker_username:
        required: true
      docker_password:
        required: true
      repository_name:
        required: true
jobs:
  build-image:
    if: contains(fromJson(needs.detect-changes.outputs.modified_dirs), 'createUser')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Build and push Docker image
        working-directory: ./usersAdministration/${{ secrets.repository_name }}
        run: |
          docker build -t ${{ secrets.docker_username }}/createUser:latest .
          docker push ${{ secrets.docker_username }}/createUser:latest