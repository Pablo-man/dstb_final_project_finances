name: Registry image

on:
  push:
    branches: ["QA"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modified_dirs: ${{ steps.changed_dirs.outputs.modified_dirs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        
      - name: Detect modified directories
        id: changed_dirs
        run: |
          git rev-parse 8d8260149d4452354a96cc96a1178768b265e22d


          MODIFIED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "modified_dirs=$MODIFIED" >> $GITHUB_OUTPUT

  login-and-pull-create:
    needs: [detect-changes]
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_CREATEUSER }}

  login-and-pull-read:
    needs: [detect-changes]
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_READUSER }}

  login-and-pull-update:
    needs: [detect-changes]
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_UPDATEUSER }}

  login-and-pull-delete:
    needs: [detect-changes]
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_DELETEUSER }}
