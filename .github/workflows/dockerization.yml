name: Registry image

on:
  push:
    branches: ["QA"]

jobs:
  change-rfolders:
    steps:
      - name: Obtener carpetas modificadas
        id: changed_dirs
        run: |
          echo "CHANGED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u | tr '\n' ' ')" >> $GITHUB_ENV

  login-and-pull-create:
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_CREATEUSER }}

  login-and-pull-read:
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_READUSER }}

  login-and-pull-update:
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_UPDATEUSER }}

  login-and-pull-delete:
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_DELETEUSER }}
