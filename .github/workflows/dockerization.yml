name: Registry image

on:
  push:
    branches: ["QA"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modified_dirs: ${{ steps.changed_dirs.outputs.modified_dirs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get last sha commit
        id: obtener_sha
        run: |
          sha_anterior=$(git log -1 --skip=1 --pretty=format:"%H")
          echo "::set-output name=sha::$sha_anterior"

      - name: Detect modified directories
        id: changed_dirs
        run: |
          CHANGED_DIRS=$(git diff --name-only ${{ steps.obtener_sha.outputs.sha }} ${{ github.sha }} | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "::set-output name=dirs::$CHANGED_DIRS" # Corregido: nombre de la salida
          echo "CHANGED_DIRS: $CHANGED_DIRS" # Para depuración

  login-and-pull-create:
    needs: [detect-changes]
    if: contains(needs.detect-changes.outputs.modified_dirs, 'createuser')
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_CREATEUSER }}

  login-and-pull-read:
    needs: [detect-changes]
    if: contains(needs.detect-changes.outputs.modified_dirs, 'readuser')
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_READUSER }}

  login-and-pull-update:
    needs: [detect-changes]
    if: contains(needs.detect-changes.outputs.modified_dirs, 'updateuser')
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_UPDATEUSER }}

  login-and-pull-delete:
    needs: [detect-changes]
    if: contains(needs.detect-changes.outputs.modified_dirs, 'deleteuser')
    uses: ./.github/workflows/userDomainCD.yml
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      repository_name: ${{ secrets.DOCKER_REPOSITORY_DELETEUSER }}
