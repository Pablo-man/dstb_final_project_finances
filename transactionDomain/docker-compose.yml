version: '3.8'

services:
  createtransaction:
    image: pamendeza/createtransaction:latest
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always
    depends_on:
      - db

  readtransaction:
    image: pamendeza/readtransaction:latest
    ports:
      - "5002:5002"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always
    depends_on:
      - db

  updatetransaction:
    image: pamendeza/updatetransaction:latest
    ports:
      - "5003:5003"
    environment:
      - DB_HOST=db
      - DB_PORT=27017
    restart: always  
    depends_on:
      - db
  db:
      image: mongo:latest
      hostname: db
      ports:
        - "27017:27017"
      volumes:
        - /home/ubuntu/data/db:/data/db

